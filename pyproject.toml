[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",    # line length is enforced by the formatter
    "B008",    # FastAPI dependency injection uses Depends() in defaults by design
    "RUF001",  # typographic characters are intentional in user-facing strings
    "RUF002",
    "RUF003",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: needs a PostgreSQL database with pgvector (TEST_DATABASE_URL)"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
